; Mission Control re-reads this file automatically a fraction of a second after it changes, so edits made from the DS4 Controller Setup
; app (or by hand) apply without a reboot. Exceptions: [bluetooth] host_name/host_address, and settings that a controller only reads
; when it connects (Dualsense options) apply the next time that controller connects.

[general]
; Enable vibration support for unofficial controllers [default true]
;enable_rumble=true
; Enable motion controls support for unoffical controllers [default true]
;enable_motion=true

[bluetooth]
; Override host name of Bluetooth adapter
;host_name=Nintendo Switch!
; Override host mac address of Bluetooth adapter
;host_address=04:20:69:04:20:69

[misc]
; Set the threshold for which ZL/ZR are considered pressed for controllers with analog triggers. Valid range [0-100] percent [default 50]
;analog_trigger_activation_threshold=50
; Enable pairing of Dualshock 3 controllers via USB. Disable to avoid conflicts with using the controller wired with sys-con [default true]
;dualshock3_enable_usb_pairing=true
; Set Dualshock 3 player LED behaviour. Valid modes [0-2] where 0=Switch pattern, 1=PS3 pattern, 2=Hybrid (Switch pattern reversed to line up with numeric labels on the controller) [default 0]
;dualshock3_led_mode=0
; Set polling rate for Sony Dualshock 4 controllers. Valid range [0-16] where 0=max, 16=min [default 8 (125Hz)]
; Refer to https://github.com/ndeadly/MissionControl/blob/4a0326308d1ff39353b045f5efb1a99c4a504c28/mc_mitm/source/controllers/dualshock4_controller.hpp#L21
;dualshock4_polling_rate=8
; Set LED lightbar brightness for Sony Dualshock 4 controllers. Valid range [0-9] where 0=off, 1=min, 2-9=12.5-100% [default 5(50%)]
;dualshock4_lightbar_brightness=4
; Set a custom LED lightbar colour for Sony Dualshock 4 controllers as hex RRGGBB (e.g. ff00aa). Applies to all players unless overridden below. Scaled by lightbar brightness (9 = full) [default unset, uses PS4 player colours]
;dualshock4_lightbar_colour=ff00aa
; Override the lightbar colour for a specific player number (1-8). Takes priority over dualshock4_lightbar_colour
;dualshock4_lightbar_colour_1=00ffff
; Remap Sony Dualshock 4 inputs to Switch buttons. Format: dualshock4_map_<input>=<button>  (applies to all Dualshock 4 controllers)
; <input> is one of: cross circle square triangle l1 r1 l2 r2 l3 r3 share options ps dpad_up dpad_down dpad_left dpad_right
;                    touchpad_left touchpad_centre touchpad_right  (the touchpad zones act as buttons when the pad is clicked)
; <button> is one of: a b x y l r zl zr plus minus home capture stickl stickr up down left right none
; Join several with + (no spaces) to press them together, e.g. zl+l. Use none to disable an input. Defaults shown below.
;dualshock4_map_cross=b
;dualshock4_map_circle=a
;dualshock4_map_square=y
;dualshock4_map_triangle=x
;dualshock4_map_l1=l
;dualshock4_map_r1=r
;dualshock4_map_l2=zl
;dualshock4_map_r2=zr
;dualshock4_map_l3=stickl
;dualshock4_map_r3=stickr
;dualshock4_map_share=minus
;dualshock4_map_options=plus
;dualshock4_map_ps=home
;dualshock4_map_dpad_up=up
;dualshock4_map_dpad_down=down
;dualshock4_map_dpad_left=left
;dualshock4_map_dpad_right=right
;dualshock4_map_touchpad_left=minus
;dualshock4_map_touchpad_centre=capture
;dualshock4_map_touchpad_right=plus
; Set LED lightbar brightness for Sony Dualsense controllers. Valid range [0-9] where 0=off, 1=min, 2-9=12.5-100% [default 5(50%)]
;dualsense_lightbar_brightness=4
; Enable the white player indicator LEDs below the Dualsense touchpad [default true]
;dualsense_enable_player_leds=false
; Set Dualsense vibration intensity, 12.5% per increment. Valid range [1-8] where 1=12.5%, 8=100% [default 4(50%)]
;dualsense_vibration_intensity=4
; Use adaptive trigger feature to limit the travel distance of the analog triggers as a percentage of the maximum travel. Valid range [0-100] percent, where 0=disabled. [default 0]
; dualsense_adaptive_trigger_travel=0
