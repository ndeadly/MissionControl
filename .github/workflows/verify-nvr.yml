name: dynamicOS NVR source verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'nvr/**'
      - 'tests/**'
      - 'appliance/**'
      - '.github/workflows/verify-nvr.yml'
  pull_request:
    paths:
      - 'nvr/**'
      - 'tests/**'
      - 'appliance/**'
jobs:
  python-and-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx cryptography uvicorn
      - name: Python compile
        run: python -m compileall -q nvr appliance tests
      - name: API tests
        env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s nvr -p 'test_*.py' -v
      - name: Appliance tests
        env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          for f in appliance/*.sh; do bash -n "$f"; done
