name: Ford Automotive feature APK verification
on:
  push:
    paths:
      - .github/workflows/ford-automotive-feature-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fiesta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated Fiesta feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fiesta-media-polish-20261122
          persist-credentials: false
      - name: Download pinned Android Auto receiver
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/andreknieriem/open-headunit.git receiver
          git -C receiver checkout --detach ae74788d8312dd7a735775ddc21370f1741a7af1
      - name: Verify source inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/merge_fiesta_autoconnect.py
          test -f tools/fiesta/LauncherActivity.java
          test -f tools/fiesta/FiestaMediaBridge.kt
          test -f dynamicOS-Fiesta/app/src/main/java/de/vd3/fiesta/MainActivity.java
          python3 -m py_compile tools/merge_fiesta_autoconnect.py
      - name: Merge native Fiesta with Android Auto receiver
        run: python3 tools/merge_fiesta_autoconnect.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile APK with Gradle
        shell: bash
        working-directory: receiver
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleGithubDebug
      - name: Confirm APK metadata
        shell: bash
        run: |
          set -euo pipefail
          find receiver/app/build/outputs/apk/github/debug -name '*.apk' -size +1M -print -quit | grep -q '.apk'
          APK=$(find receiver/app/build/outputs/apk/github/debug -name '*.apk' | head -n1)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
      - name: Upload tested build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-Ford-Automotive-APK
          path: receiver/app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Preserve receiver licensing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Receiver-License
          path: |
            receiver/LICENSE
            receiver/COPYRIGHT_MICHAEL_REID_GPLv3AFFERO.txt
          if-no-files-found: warn
