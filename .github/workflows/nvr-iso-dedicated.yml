name: dynamicOS NVR dedicated Debian ISO build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nvr-iso-dedicated.yml'
permissions:
  contents: read
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet || true
          docker system prune -af || true
          df -h .
      - name: Build Debian 13 ISO in privileged ephemeral container
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p nvr-iso
          docker run --rm --privileged --network=host -v "$PWD:/work" -w /work debian:trixie bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y live-build debootstrap xorriso squashfs-tools grub-efi-amd64-bin syslinux-common ca-certificates
            bash appliance/build-iso.sh /work/nvr-iso
          ' 2>&1 | tee nvr-iso/build.log
      - name: Verify ISO and checksum
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          images=(nvr-iso/*.iso)
          if (( ${#images[@]} != 1 )); then echo "Expected one ISO, got ${#images[@]}"; exit 1; fi
          test "$(stat -c %s "${images[0]}")" -gt 100000000
          xorriso -indev "${images[0]}" -report_el_torito plain
          sha256sum "${images[0]}" > nvr-iso/SHA256SUMS.txt
          echo "UNVERIFIED TEST ISO ONLY; not a fully encrypted automatic installer." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ISO checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-ISO-SHA256
          path: nvr-iso/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-Debian13-TEST-ISO
          path: nvr-iso/*.iso
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-ISO-build-log
          path: nvr-iso/build.log
          if-no-files-found: warn
          retention-days: 14
