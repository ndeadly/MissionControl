name: dynamicOS NVR continuous verification
on:
  workflow_dispatch:
  push:
    paths: ['nvr/**', 'tests/**', 'appliance/**', 'android/**', '.github/workflows/nvr-ci.yml']
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: test -f nvr/nvr.py && test -f appliance/build-iso.sh && test -f android/app/build.gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'fastapi<1' 'httpx<1' 'cryptography>=41' 'uvicorn<1'
      - run: python -m compileall -q nvr appliance tests
      - run: find appliance -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s nvr -p 'test_*.py' -v
      - env:
          PYTHONPATH: nvr
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  iso:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-efi-amd64-bin syslinux-common
      - run: sudo bash appliance/build-iso.sh "$RUNNER_TEMP/nvr-iso"
      - uses: actions/upload-artifact@v4
        with:
          name: dynamicOS-NVR-Linux-ISO-UNVERIFIED
          path: ${{ runner.temp }}/nvr-iso/*.iso
          if-no-files-found: error
